name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/SalesDashboard.slnx --locked-mode

      - name: Unit tests
        run: dotnet test backend/tests/SalesDashboard.UnitTests --no-restore --filter TestCategory=Unit

      - name: Integration tests
        run: dotnet test backend/tests/SalesDashboard.IntegrationTests --no-restore --filter TestCategory=Integration

      - name: Backend E2E tests
        run: >-
          dotnet test backend/tests/SalesDashboard.E2ETests --no-restore
          --filter "TestCategory=E2E&TestCategory!=BrowserE2E"

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start Compose
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/api/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Check API and frontend proxy
        run: |
          curl --fail --silent "http://localhost:8080/api/dashboard?from=2026-09-01&to=2026-09-25"
          curl --fail --silent "http://localhost:3000/api/dashboard?from=2026-09-01&to=2026-09-25"
          curl --fail --silent http://localhost:3000/

      - name: Check services
        run: docker compose ps

      - name: Stop Compose
        if: always()
        run: docker compose down -v

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore E2E project
        run: dotnet restore backend/tests/SalesDashboard.E2ETests --locked-mode

      - name: Build E2E project
        run: dotnet build backend/tests/SalesDashboard.E2ETests --no-restore

      - name: Install Chromium
        run: >-
          pwsh backend/tests/SalesDashboard.E2ETests/bin/Debug/net10.0/playwright.ps1
          install --with-deps chromium

      - name: Verify Chromium installation
        run: |
          test -f backend/tests/SalesDashboard.E2ETests/bin/Debug/net10.0/playwright.ps1
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
          test -n "$(find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 2 -type d -name 'chromium-*' -print -quit)"

      - name: Start frontend and API
        run: docker compose up -d --build

      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run browser tests
        env:
          FRONTEND_E2E_URL: http://localhost:3000
        run: >-
          dotnet test backend/tests/SalesDashboard.E2ETests --no-build
          --filter TestCategory=BrowserE2E

      - name: Stop Compose
        if: always()
        run: docker compose down -v

  publish-images:
    name: Publish container images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, compose-smoke, browser-e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
