name: sales-dashboard
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: sales_dashboard
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - sales-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_dashboard"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ConnectionStrings__Sales: Host=postgres;Database=sales_dashboard;Username=sales;Password=sales_local
      Seed__AnchorDate: ${SEED_ANCHOR_DATE:-}
      DOTNET_DiagnosticPorts: /diag/port.sock,suspend=n
      OTEL_SERVICE_NAME: sales-dashboard-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_PROPAGATORS: tracecontext,baggage
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - diagnostics:/diag
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
  dotnet-monitor:
    image: mcr.microsoft.com/dotnet/monitor:10
    command: ["collect", "--no-auth"]
    environment:
      DOTNETMONITOR_DiagnosticPort__ConnectionMode: Listen
      DOTNETMONITOR_DiagnosticPort__EndpointName: /diag/port.sock
      DOTNETMONITOR_Urls: http://+:52323
    ports:
      - "127.0.0.1:52323:52323"
    volumes:
      - diagnostics:/diag
    depends_on:
      - backend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
volumes:
  sales-data:
  diagnostics:
